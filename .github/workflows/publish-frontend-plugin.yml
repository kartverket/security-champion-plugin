name: Publish Security Champion Frontend Package to npmjs
on:
    workflow_dispatch:
    push:
        tags:
            - "v*"
jobs:
    build:
        defaults:
            run:
                working-directory: plugins/security-champion
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  registry-url: "https://registry.npmjs.org"
                  scope: "@kartverket"
            - run: corepack enable
            - run: yarn install --immutable
            - run: yarn tsc
            - run: yarn build
            - run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.KARTVERKET_BACKSTAGE_NPM_TOKEN }}
